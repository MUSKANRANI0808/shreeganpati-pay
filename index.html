    .card { background: #fff; max-width: 380px; width: 100%; border-radius: 16px; padding: 24px 20px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .badge { background: #dbeafe; color: #1d4ed8; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
    h2 { margin: 4px 0 8px; color: #111827; }
    .upi { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 8px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: inline-block; }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      padding: 14px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .logo-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      color: #111827;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .logo-pill svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .qr { width: 175px; height: 175px; border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px; margin-top: 8px; }
  </style>
</head>
